<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Target Display - Hainam04112001</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .card-container {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            max-width: 480px;
            width: 90%;
            border: 1px solid #333;
        }
        .target-img {
            width: 100%;
            max-width: 360px;
            border: 3px solid #00d2ff;
            border-radius: 10px;
            margin: 15px 0;
            background: #ffffff;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .url-box {
            background: #2a2a2a;
            padding: 10px 15px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 10px;
            border: 1px dashed #00d2ff;
            word-break: break-all;
        }
        .url-text {
            color: #00d2ff;
            font-size: 16px;
            font-weight: bold;
            margin: 5px 0 0 0;
        }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 5px; color: #00d2ff;">🎯 MÃ QUÉT AR TARGET</h1>
    <p style="color: #bbb; max-width: 600px; padding: 0 20px;">
        Máy tính bàn dùng để hiển thị ảnh mẫu.<br>
        Hãy dùng <b>điện thoại di động</b> mở đường link AR bên dưới để quét:
    </p>
    
    <div class="card-container">
        <!-- Ảnh Target AR mẫu chuẩn -->
        <img class="target-img" src="https://raw.githubusercontent.com/hiukim/mind-ar-js/master/examples/image-tracking/assets/card-example/card.png" alt="AR Target Image">
        
        <div class="url-box">
            <span style="font-size: 13px; color: #aaa;">Link mở trên điện thoại (Quét AR):</span>
            <p class="url-text">https://hainam04112001.github.io/web-demo-ar/ar.html</p>
        </div>
    </div>

</body>
</html>
